[alembic]
# Sin esto, `alembic upgrade head` no encuentra el paquete `app`: el CLI de
# alembic NO agrega el cwd a sys.path (uvicorn sí — por eso el server corre y
# las migraciones tronaban con ModuleNotFoundError).
prepend_sys_path = .
script_location = alembic
sqlalchemy.url = postgresql://user:password@host:5432/database

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
