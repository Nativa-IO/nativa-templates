services:
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-}
    labels:
      caddy: http://${PUBLIC_FRONTEND_HOST:-}
      caddy.reverse_proxy: "{{upstreams 3000}}"
    networks:
      - network
      - caddy-ingress

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    working_dir: /app
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=preview
    labels:
      caddy: http://${PUBLIC_API_HOST:-}
      caddy.reverse_proxy: "{{upstreams 8000}}"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - network
      - caddy-ingress

networks:
  network:
    driver: bridge
  caddy-ingress:
    name: ${CADDY_INGRESS_NETWORK:-nativa-ingress}
    external: true
